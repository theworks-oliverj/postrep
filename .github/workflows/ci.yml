name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator dependencies
        run: pip install jsonschema referencing
      - name: Tests (jsonschema validator)
        run: python3 tests/run_tests.py
      - name: Tests (built-in validator)
        run: VIRGIL_BUILTIN_VALIDATOR=1 python3 tests/run_tests.py
      - name: Bundle is up to date
        run: python3 tools/build_bundle.py --check
