name: Bug report
description: A script, schema, test or the bundle build does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste personal data** (names, employer, nationality, contact details, life-plan text). Use synthetic or redacted examples.
  - type: input
    id: version
    attributes:
      label: Version
      description: Protocol version and, if relevant, Python version and OS.
      placeholder: "1.0.0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      description: Which script, schema or file is affected?
      placeholder: "scripts/merge.py"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. Include the command and the error output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, synthetic input is ideal.
    validations:
      required: false
